<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      content="Buy and sell safely at LASUED, LASU, and Epe. Find verified accommodation, roommates, services, and student businesses in one place."
      data-rh="true"
    />

      name="keywords"
      content="LASUED, LASU Epe, Epe marketplace, student accommodation, buy and sell Nigeria, campus marketplace"
    />
    <meta name="robots" content="index, follow" />
    <meta
      name="google-site-verification"
      content="p5oFsGjWPWagiZfEUTIo9IKoUAhsfgtz4njSqcu0xJo"
    />

    <!-- Open Graph / WhatsApp Social Sharing -->
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:site_name" content="LASUEDPLUG" data-rh="true" />
    <meta
      property="og:title"
      content="LASUEDPLUG — The Official LASUED &amp; Epe Campus Marketplace"
      data-rh="true"
    />
    <meta
      property="og:description"
      content="Buy and sell safely at LASUED, LASU, and Epe. Find verified accommodation, roommates, services, and student businesses in one place."
      data-rh="true"
    />
    <meta property="og:image" content="https://raw.githubusercontent.com/SOLVATECHOFFICIAL/Lasuedplug.com/main/lasued.png" data-rh="true" />

    <!-- Twitter / X Social Card -->
    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta
      name="twitter:title"
      content="LASUEDPLUG — The Official LASUED &amp; Epe Campus Marketplace"
      data-rh="true"
    />
    <meta
      name="twitter:description"
      content="Buy and sell safely at LASUED, LASU, and Epe. Find verified accommodation, roommates, services, and student businesses in one place."
      data-rh="true"
    />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/SOLVATECHOFFICIAL/Lasuedplug.com/main/lasued.png" data-rh="true" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LASUEDPLUG",
        "url": "https://lasuedplug.com",
        "applicationCategory": "ShoppingApplication",
        "operatingSystem": "All",
        "description": "Buy and sell safely at LASUED, LASU, and Epe. Find verified accommodation, roommates, services, and student businesses in one place.",
        "author": {
          "@type": "Person",
          "name": "Oyeyemi Solomon",
          "jobTitle": "Founder & Developer",
          "description": "Geography Education student at Lagos State University of Education (LASUED) and founder of SOLVATECH",
          "telephone": "+2349049979183"
        },
        "publisher": {
          "@type": "Organization",
          "name": "SOLVATECH"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "NGN"
        }
      }
    </script>

    <meta name="theme-color" content="#1d4ed8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LASUEDPLUG" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/lasued.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: #ffffff;
        color: #0f172a;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      #app-splash img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        object-fit: contain;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }
      #app-splash .splash-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      #app-splash .splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e2e8f0;
        border-top-color: #1d4ed8;
        border-radius: 9999px;
        animation: lasuedplug-spin 0.75s linear infinite;
      }
      @keyframes lasuedplug-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 font-sans text-slate-900 antialiased">
    <div id="root">
      <div id="app-splash" aria-label="Loading LASUEDPLUG">
        <img src="/lasued.png" alt="LASUEDPLUG logo" />
        <span class="splash-title">LASUEDPLUG</span>
        <span class="splash-spinner" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
